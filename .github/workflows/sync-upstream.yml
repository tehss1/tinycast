name: Sync upstream

run-name: "Prepare upstream Tinycast merge"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository != 'abue-ammar/tinycast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch official Tinycast
        run: |
          git remote add upstream https://github.com/abue-ammar/tinycast.git
          git fetch upstream main --tags

      - name: Prepare merge branch
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/upstream-sync
          git merge --no-edit upstream/main
          git push --force-with-lease origin automation/upstream-sync
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or refresh merge request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view automation/upstream-sync --json url >/dev/null 2>&1; then
            gh pr edit automation/upstream-sync \
              --title "Merge official Tinycast improvements" \
              --body "Merge the latest official Tinycast changes into the Composer build. Run the complete local test suite before merging and publishing a release."
          else
            gh pr create \
              --base main \
              --head automation/upstream-sync \
              --title "Merge official Tinycast improvements" \
              --body "Merge the latest official Tinycast changes into the Composer build. Run the complete local test suite before merging and publishing a release."
          fi
