name: Verify Composer build

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "Branch to test instead of the triggering commit"
        type: string
        default: ""

permissions:
  contents: read

# Only a pull request supersedes itself; a push or a release's call must never cancel another run.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner."
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install validation tools
        run: brew install xcodegen swiftlint

      - name: Regenerate the Xcode project
        run: xcodegen generate

      - uses: actions/upload-artifact@v7
        with:
          name: generated-project
          path: Tinycast.xcodeproj/project.pbxproj

      - name: Check generated project is committed
        run: git diff --exit-code -- Tinycast.xcodeproj

      - name: Check Composer retention and release fixtures
        run: ./Tests/release-pipeline-test.sh

      - name: Run test suite
        env:
          # Draws text into a bitmap, which a hosted runner without a display leaves blank.
          TINYCAST_TEST_SKIP: form-input-test
          TINYCAST_TEST_JOBS: 2
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: ./Scripts/run-tests.sh

      - name: Build Debug without signing
        run: |
          set -o pipefail
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/debug-build.log"
          ./Scripts/check-build-warnings.sh "$RUNNER_TEMP/debug-build.log"

      - name: Lint
        run: ./Scripts/lint.sh

      - name: Check model imports
        run: |
          if grep -rln 'import AppKit\|import SwiftUI\|import Cocoa' Tinycast/Features/*/Model/; then exit 1; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-evidence
          path: |
            ${{ runner.temp }}/tinycast-harness/*.log
            ${{ runner.temp }}/debug-build.log
