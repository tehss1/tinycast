name: Release

run-name: "Tinycast ${{ inputs.version }} · ${{ inputs.channel }} #${{ github.run_number }}"

# Beta builds get an auto-incrementing suffix so re-running never collides.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: "Base version, e.g. 0.2.0 (no channel suffix)"
        type: string
        required: true

permissions:
  contents: write
  # Dispatches the Website workflow, whose version and changelog are read at build time.
  actions: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate release inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          BASE_VERSION: ${{ inputs.version }}
        run: ./Scripts/release-metadata.sh "$GITHUB_OUTPUT"
      - run: ./Tests/release-pipeline-test.sh

  verify:
    needs: preflight
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: macos-26
    # Consumed by the `universal` job, so the channel identity is derived in exactly one place.
    outputs:
      full_version: ${{ steps.meta.outputs.full_version }}
      display_name: ${{ steps.meta.outputs.display_name }}
      bundle_id: ${{ steps.meta.outputs.bundle_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Compute release metadata
        id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
          BASE_VERSION: ${{ inputs.version }}
        run: ./Scripts/release-metadata.sh "$GITHUB_OUTPUT"

      # The SAME cert on every release is what keeps users' Accessibility grant across updates.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so xcodebuild's codesign finds "Tinycast Self-Signed".
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build app
        env:
          VERSION: ${{ steps.meta.outputs.full_version }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          BUILD_NUMBER: ${{ github.run_number }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          # ARCHS pinned: trusting ARCHS_STANDARD once let a thin arm64 build reach Intel users.
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Tinycast Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME="$DISPLAY_NAME" TINYCAST_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            TINYCAST_UPDATE_REPOSITORY="$UPDATE_REPOSITORY" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      # Apple silicon users pay for no Intel slice, and a bundled helper is shipped code too.
      - name: Assert the build is arm64-only
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          for BIN in "$APP/Contents/MacOS/${DISPLAY_NAME}" "$APP/Contents/Helpers/ClipboardTextHelper" "$APP/Contents/Helpers/Tinycast Dictation.app/Contents/MacOS/Tinycast Dictation"; do
            SLICES="$(lipo -archs "$BIN")"
            if [ "$SLICES" != "arm64" ]; then
              echo "::error::${BIN##*/}: expected arm64 alone, got '$SLICES'"
              exit 1
            fi
          done

      # Notarization rejects a nested binary without the hardened runtime; don't trust Xcode.
      - name: Assert the signature is notarizable
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
        run: ./Scripts/verify-signature.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"

      # The zip is for the in-app updater, which expands it with `ditto` instead of mounting.
      - name: Package DMG and ZIP
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName "$DISPLAY_NAME" "dist/${DMG_FILE}"
          # Only `ditto` keeps the signature verifiable; plain `zip` drops symlinks and the seal.
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/${ZIP_FILE}"

      - uses: actions/upload-artifact@v7
        with:
          name: Tinycast-${{ steps.meta.outputs.full_version }}
          path: dist/

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ github.event.inputs.channel }}
          TAG: v${{ steps.meta.outputs.full_version }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.meta.outputs.full_version }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          CASK: ${{ steps.meta.outputs.cask_name }}
        run: ./Scripts/release-notes.sh "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/changelog.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.meta.outputs.full_version }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # --notes-file, never --generate-notes: gh would put the install text above the changelog.
          gh release create "$TAG" --target "$GITHUB_SHA" \
            "dist/${{ steps.meta.outputs.dmg_file }}" \
            "dist/${{ steps.meta.outputs.zip_file }}" \
            --title "${{ steps.meta.outputs.display_name }} ${{ steps.meta.outputs.full_version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $PRERELEASE_FLAG

      - name: Update Homebrew cask
        if: github.repository == 'abue-ammar/tinycast'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          VERSION: ${{ steps.meta.outputs.full_version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping cask bump. Add it to enable auto-updates of the tap."
            exit 0
          fi
          SHA="$(shasum -a 256 "dist/${DMG_FILE}" | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/abue-ammar/homebrew-tinycast.git" tap
          CASK_FILE="tap/Casks/${CASK}.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "::error::$CASK_FILE not found in tap."
            exit 1
          fi
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "${CASK} ${VERSION}"
            git push
          fi

      # A dispatch is the one event GITHUB_TOKEN may start another workflow with.
      - name: Rebuild the website
        if: github.event.inputs.channel == 'stable' && github.repository == 'abue-ammar/tinycast'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Announce on Discord
        if: success() && github.repository == 'abue-ammar/tinycast'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL: ${{ github.event.inputs.channel }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          VERSION: ${{ steps.meta.outputs.full_version }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          TAG: v${{ steps.meta.outputs.full_version }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret not set — skipping Discord announcement."
            exit 0
          fi
          if [ "${CHANNEL}" = "stable" ]; then COLOR=3066993; else COLOR=15844367; fi
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          INSTALL="brew install --cask abue-ammar/tinycast/${CASK}"
          # jq keeps backticks literal; Components V2 forbids top-level `content`, hence @everyone.
          jq -n \
            --argjson color "${COLOR}" \
            --arg heading "## 🚀 ${DISPLAY_NAME} ${VERSION}" \
            --arg sub "Now available on the **${CHANNEL}** channel." \
            --arg install "${INSTALL}" \
            --arg url "${RELEASE_URL}" \
            --rawfile changelog "${RUNNER_TEMP}/changelog.md" \
            '{
              flags: 32768,
              allowed_mentions: { parse: ["everyone"] },
              components: [
                { type: 10, content: "@everyone" },
                { type: 17, accent_color: $color, components: [
                  { type: 9,
                    components: [ { type: 10, content: ($heading + "\n" + $sub) } ],
                    accessory: { type: 2, style: 5, label: "Download", url: $url }
                  },
                  { type: 14 },
                  { type: 10, content: ($changelog | rtrimstr("\n")) },
                  { type: 14 },
                  { type: 10, content: ("**Install / update via Homebrew**\n```\n" + $install + "\n```") }
                ] }
              ]
            }' > payload.json
          curl -fsS -X POST -H "Content-Type: application/json" -d @payload.json \
            "${DISCORD_WEBHOOK_URL}?with_components=true"

  # macOS 26 is the last release to boot on Intel, so stable also ships a universal build.
  universal:
    needs: build
    if: github.event.inputs.channel == 'stable'
    runs-on: macos-26
    env:
      VERSION: ${{ needs.build.outputs.full_version }}
      DISPLAY_NAME: ${{ needs.build.outputs.display_name }}
      BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
      CASK: tinycast-universal
      UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      # The SAME identity, or fail: the updater compares the staged bundle's leaf certificate.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "${P12_BASE64}" ]; then
            echo "::error::SIGNING_P12_BASE64 not set — a differently-signed build cannot self-update."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Tinycast Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME="$DISPLAY_NAME" TINYCAST_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            TINYCAST_UPDATE_REPOSITORY="$UPDATE_REPOSITORY" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      # A silently-dropped ARCHS override, app or helper, would ship a thin build as universal.
      - name: Assert both slices on the shipping binaries
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          PLIST_MIN="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          echo "LSMinimumSystemVersion=$PLIST_MIN"
          if [ "$PLIST_MIN" != "26.0" ]; then
            echo "::error::expected LSMinimumSystemVersion 26.0, got $PLIST_MIN"
            exit 1
          fi
          for BIN in "$APP/Contents/MacOS/${DISPLAY_NAME}" "$APP/Contents/Helpers/ClipboardTextHelper" "$APP/Contents/Helpers/Tinycast Dictation.app/Contents/MacOS/Tinycast Dictation"; do
            SLICES="$(lipo -archs "$BIN")"
            echo "${BIN##*/}: arch=$SLICES"
            for A in arm64 x86_64; do
              case " $SLICES " in
                *" $A "*) ;;
                *) echo "::error::${BIN##*/}: no $A slice — this is not a universal build"; exit 1 ;;
              esac
              MINOS="$(xcrun vtool -arch "$A" -show-build-version "$BIN" | awk '/minos/{print $2}')"
              if [ "$MINOS" != "26.0" ]; then
                echo "::error::${BIN##*/} $A: expected a macOS 26.0 floor, got minos=$MINOS"
                exit 1
              fi
            done
          done

      - name: Assert the signature is notarizable
        run: ./Scripts/verify-signature.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"

      - name: Package DMG and ZIP
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName "$DISPLAY_NAME" \
            "dist/Tinycast-Universal-${VERSION}.dmg"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/Tinycast-Universal-${VERSION}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Tinycast-Universal-${{ needs.build.outputs.full_version }}
          path: dist/

      # Uploaded second, so clients predating arch-aware selection still take the thin zip first.
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${VERSION}" \
            "dist/Tinycast-Universal-${VERSION}.dmg" \
            "dist/Tinycast-Universal-${VERSION}.zip"

      - name: Update Homebrew cask
        if: github.repository == 'abue-ammar/tinycast'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping cask bump."
            exit 0
          fi
          SHA="$(shasum -a 256 "dist/Tinycast-Universal-${VERSION}.dmg" | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/abue-ammar/homebrew-tinycast.git" tap
          CASK_FILE="tap/Casks/${CASK}.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "::error::$CASK_FILE not found in tap."
            exit 1
          fi
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "${CASK} ${VERSION}"
            git push
          fi

  # A fork's release is dispatched unattended by the upstream sync, so a failed build needs a reader.
  report:
    needs: [preflight, verify, build, universal]
    if: ${{ always() && github.repository != 'abue-ammar/tinycast' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          TITLE="Tinycast ${VERSION} (${CHANNEL}) failed to release"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --force \
            --description "Opened by a failed Release run"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure \
            --json title --jq "[.[] | select(.title == \"${TITLE}\")] | length")"
          if [ "$EXISTING" != "0" ]; then exit 0; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --label release-failure --title "$TITLE" \
            --body "The Release workflow did not finish: ${RUN_URL}

          Re-run it from the Actions tab once the cause is fixed, then close this issue."
